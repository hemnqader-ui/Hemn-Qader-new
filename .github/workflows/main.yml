name: Build Web App

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install and Build
      run: |
        npm install
        npm run build || echo "Skipping build script"

    - name: Upload Web Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MandTV-WebFiles
        path: |
          *.html
          *.js
          *.css
          *.json
          assets/
